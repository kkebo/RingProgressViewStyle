name: ci
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  build-macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-
      - run: xcrun swift --version
      - run: xcrun swift build
  build-ios:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-ios-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-ios-swiftpm-
      - run: xcrun swift --version
      - run: xcrun swift build --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
  build-sample-app:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Example.swiftpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/.swiftpm
            Example.swiftpm/.derivedData
          key: ${{ runner.os }}-xcode-26.1.1-${{ hashFiles('Example.swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-xcode-26.5.0-
      - run: xcodebuild -version
      - run: xcodebuild build -scheme Example -destination "platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.5" -derivedDataPath ./.derivedData -quiet -showBuildTimingSummary
  lint:
    runs-on: ubuntu-24.04-arm
    container: swift:6.3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift format lint -rsp .
  yamllint:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: yamllint --version
      - run: yamllint --strict --config-file .yamllint.yml .
